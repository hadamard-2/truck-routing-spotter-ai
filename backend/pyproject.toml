[project]
name = "truck-routing-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
